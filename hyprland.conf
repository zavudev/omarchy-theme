# Zavu — versión .conf del tema, para instalaciones de Hyprland que aún no
# usan la configuración Lua de Omarchy. Espejo exacto de hyprland.lua.
# No es una configuración completa: está pensada para incluirse desde la tuya.

general {
    col.active_border = rgba(615fffff)
    col.inactive_border = rgba(27272aff)
    gaps_in = 5
    gaps_out = 10
    border_size = 1
}

group {
    col.border_active = rgba(615fffff)
    col.border_inactive = rgba(27272aff)
}

decoration {
    rounding = 0
    shadow {
        enabled = no
    }
}

animations {
    enabled = true

    # ZAVU.motion.defaultEasing — sin overshoot, sin muelle.
    bezier = zavuStandard, 0.22, 1, 0.36, 1
    bezier = zavuAccel, 0.4, 0, 1, 1

    animation = windowsIn, 1, 4, zavuStandard, popin 97%
    animation = windowsOut, 1, 3, zavuAccel, popin 97%
    animation = windowsMove, 1, 4, zavuStandard
    animation = border, 1, 8, zavuStandard

    animation = layersIn, 1, 3, zavuStandard, fade
    animation = layersOut, 1, 3, zavuAccel, fade
    animation = fadeLayersIn, 1, 3, zavuStandard
    animation = fadeLayersOut, 1, 3, zavuAccel

    animation = workspaces, 1, 5, zavuStandard, slide
    animation = specialWorkspaceIn, 1, 4, zavuStandard, slidevert
    animation = specialWorkspaceOut, 1, 3, zavuAccel, slidevert
}
