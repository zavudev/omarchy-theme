# Zavu — notificaciones (mako, fallback fuera del shell de Omarchy).
text-color=#FFFFFF
border-color=#27272A
background-color=#18181B
width=420
height=110
padding=14
border-size=1
border-radius=0
font=Liberation Sans 11
anchor=top-right
outer-margin=20
default-timeout=5000
max-icon-size=32

[urgency=critical]
border-color=#FF5E5E
default-timeout=0

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false
